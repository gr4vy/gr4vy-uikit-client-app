name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Gr4vy UIKit Sample App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
          
      - name: Build
        run: |
          # Build only, so no particular simulator is needed. Picking one by name broke when
          # the first iPhone listed wasn't in the latest iOS runtime.
          xcodebuild build \
            -project gr4vy-uikit.xcodeproj \
            -scheme "Gr4vy UIKit Sample App" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug
